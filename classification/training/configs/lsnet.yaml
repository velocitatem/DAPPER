# LSNet Configuration

# Data settings
data:
  base_data_dir: "./data"
  cache_dir: "./data/cache"
  seed: 2025
  use_cache: true
  val_split: 0.2
  
  # Dataset settings
  datasets:
    - imagenet
  
  # DataLoader settings
  dataloader:
    batch_size: 128
    num_workers: 12
    pin_memory: true

# Model settings
model:
  name: "lsnet_t"  # Options: lsnet_t, lsnet_s, lsnet_b
  pretrained: true
  freeze_backbone: false
  num_classes: 1000  # ImageNet has 1000 classes

# Training settings
training:
  device: "cuda"  # Options: cuda, cpu
  num_epochs: 100
  optimizer:
    name: "adam"  # Options: adam, sgd
    learning_rate: 0.001
    weight_decay: 0.0001
  scheduler:
    name: "cosine_annealing"  # Options: reduce_on_plateau, cosine_annealing, step
    patience: 5
    factor: 0.5
    min_lr: 0.00001
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.001
  
  # Loss function
  loss:
    name: "cross_entropy"  # Options: cross_entropy, focal_loss

# Experiment tracking
logging:
  log_dir: "./logs"
  experiment_name: "lsnet_training"  # Will use timestamp if null
  tensorboard:
    enabled: true
    log_histograms: true
    log_images: true
    log_model_graph: true
  